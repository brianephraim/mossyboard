services:
  postgres:
    image: postgres:16
    container_name: kanban_dev_pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${KANBAN_DOCKER_PG_PORT:-5432}:5432"
    volumes:
      - kanban_dev_pg_data:/var/lib/postgresql/data

volumes:
  kanban_dev_pg_data:
